# ─── Tools ────────────────────────────────────────────────────────────────────

[tools]
# Languages & runtimes
go = "1.27.4"
bun = "1.4.4"

# App framework & bundled renderer
"go:github.com/wailsapp/wails/v3/cmd/wails3" = "3.1.0"
typst = "0.15.1"

# Formatting
"npm:oxfmt" = "0.77.0"

# ─── App ──────────────────────────────────────────────────────────────────────

[tasks.dev]
description = "Run the app in dev mode (Vite HMR + Go rebuild on change)"
run = "wails3 dev"

[tasks.build]
description = "Build the app binary into bin/"
run = "wails3 build"

[tasks.package]
description = "Package a production build (.app on macOS, with Typst inside)"
run = "wails3 package"

[tasks.cleanup]
description = "Delete build output (bin/, frontend/dist, .task, .wails) and forget stale app bundles in Launch Services. Afterwards `go build .` fails (main.go embeds frontend/dist) until the next `mise run build` or `dev`"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ "$(uname)" == Darwin ]]; then
  lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
  # Unregister our bundles first so "Open With" and Spotlight stop offering them.
  for app in "$PWD"/bin/*.app "$PWD"/bin/macos/*.app; do
    if [[ -e "$app" ]]; then
      "$lsregister" -u "$app" || true
      echo "unregistered $app"
    fi
  done
  # Registrations whose bundle is already gone (moved, deleted, ejected DMG).
  "$lsregister" -dump | awk '/^path:/ { sub(/^path: +/, ""); sub(/ \(0x[0-9a-f]+\)$/, ""); p = $0 }
    /^identifier: +com\.dustinmichels\.peanutwriter$/ { print p }' | sort -u |
    while IFS= read -r app; do
      if [[ ! -e "$app" ]]; then
        "$lsregister" -u "$app" 2>/dev/null || true
        echo "unregistered missing $app"
      elif [[ "$app" != "$PWD"/bin/* ]]; then
        echo "kept other copy: $app"
      fi
    done
fi
rm -rf bin frontend/dist .task .wails
echo "removed bin/ frontend/dist/ .task/ .wails/"
'''

# ─── Quality ──────────────────────────────────────────────────────────────────

[tasks.test]
description = "Go tests (the Typst ones need typst, which mise installs) and the editor's (bun test)"
run = ["go test ./internal/...", "cd frontend && bun test"]

[tasks.check]
description = "Type-check the editor"
dir = "frontend"
run = "bunx vue-tsc --noEmit"

[tasks.fmt]
description = "Format our Go with gofmt (skips Wails' build/ scaffolding) and everything else with oxfmt (skips generated bindings and the numbering samples, whose odd Markdown is the point)"
run = ["gofmt -w *.go internal", "oxfmt '!frontend/bindings/**' '!internal/doc/testdata/**'"]

# ─── Docs ─────────────────────────────────────────────────────────────────────

[tasks.docs]
description = "Run the documentation site (VitePress) with hot reload"
dir = "docs"
run = ["bun install", "bun run dev"]

[tasks."docs:build"]
description = "Build the documentation site into docs/.vitepress/dist"
dir = "docs"
run = ["bun install", "bun run build"]

[tasks."docs:screenshots"]
description = "Screenshot the app (server mode, in WebKit) into docs/public/screenshots. Pass scene names to redo only those"
run = [
  "wails3 task build:server",
  "cd docs && bun install && bunx playwright install webkit && bun scripts/screenshots.ts",
]

[tasks."docs:demo"]
description = "Record the demo video (server mode, in WebKit, with captions and a generated soundtrack) into demo/peanut-writer-demo.mp4, or demo/<name>.mp4 with `-- <name>`. Needs ffmpeg"
run = [
  "wails3 task build:server",
  "cd docs && bun install && bunx playwright install webkit && bun scripts/demo-video.ts",
]

# ─── Release ──────────────────────────────────────────────────────────────────

[tasks."release:package"]
description = "Build the release files (universal, signed and notarized Peanut-Writer.dmg and .zip, checksums.txt) into bin/release without publishing; optional version arg"
run = "scripts/package.sh"

[tasks.release]
description = "Check the tree is clean and level with origin/main, check signing and notarization, test, package, tag, publish a GitHub release (patch by default; or minor, major, X.Y.Z), and update the Homebrew cask"
run = "scripts/release.sh"

[tasks.cask]
description = "Point the Homebrew cask in dustinmichels/homebrew-tap at a release (default: the latest), creating it if missing"
run = "scripts/update-cask.sh"
